spring.application.name=revenue-recovery

# recovery-engine/.env when started from backend/revenue-recovery
spring.config.import=optional:file:../../.env[.properties]

# --- Postgres (recovery-engine/docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:revenue_recovery}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# --- Kafka (host apps use localhost:9092; other containers use kafka:29092) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=recovery-engine-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Razorpay Test Mode ---
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Webhook ingest (Step 1.4) ---
recovery.webhook.idempotency-ttl=24h
recovery.kafka.payment-events-topic=payment.events
recovery.kafka.invoice-events-topic=invoice.events
recovery.kafka.checkout-events-topic=checkout.events
spring.kafka.producer.acks=all

# --- ML gate: labelled outcomes below this → playbook only; at/above → also call /predict ---
# Production: 10000. Local 400 so the 500-row acc_syn_training seed crosses the line.
recovery.ml.predict-url=${ML_PREDICT_URL:http://localhost:8001/predict}
recovery.ml.min-labelled-outcomes=${ML_MIN_LABELLED_OUTCOMES:400}
recovery.ml.consider-min-probability=0.25
recovery.ml.min-history-payments-to-override=5
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.kafka.enabled=true
